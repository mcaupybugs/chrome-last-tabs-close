<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Auto-Close</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="popup">
    <header class="header">
      <h1 class="title">Tab Auto-Close</h1>
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="enableToggle" />
          <span class="slider"></span>
        </label>
        <span id="statusLabel" class="status-label">Active</span>
      </div>
    </header>

    <section class="stats" id="statsSection">
      <span id="statsText">0 tabs open, 0 inactive</span>
    </section>

    <section class="section">
      <h2 class="section-title">Countdown</h2>
      <ul class="list" id="countdownList">
        <li class="empty-state">No tabs in countdown</li>
      </ul>
    </section>

    <section class="section">
      <h2 class="section-title">Recently Closed</h2>
      <ul class="list" id="historyList">
        <li class="empty-state">No recently closed tabs</li>
      </ul>
    </section>

    <footer class="footer">
      <a href="#" id="settingsLink" class="settings-link">⚙ Settings</a>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
