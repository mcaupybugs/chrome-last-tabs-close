<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Manager — Settings</title>
  <link rel="stylesheet" href="./options.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Tab Manager Settings</h1>
    </header>

    <!-- Rules Section -->
    <section class="card">
      <h2>Rules</h2>

      <div class="rule-group">
        <div class="rule-header">
          <label class="switch">
            <input type="checkbox" id="enableInactivityRule" />
            <span class="slider"></span>
          </label>
          <span class="rule-label">Inactivity Rule</span>
        </div>
        <div class="rule-body" id="inactivityRuleBody">
          <label class="range-label" for="inactivityTimeout">
            Close tabs inactive for <strong id="inactivityValue">30</strong> minutes
          </label>
          <input
            type="range"
            id="inactivityTimeout"
            min="5"
            max="120"
            step="5"
            value="30"
          />
        </div>
      </div>

      <div class="rule-group">
        <div class="rule-header">
          <label class="switch">
            <input type="checkbox" id="enableMaxTabsRule" />
            <span class="slider"></span>
          </label>
          <span class="rule-label">Max Tabs Rule</span>
        </div>
        <div class="rule-body" id="maxTabsRuleBody">
          <label class="range-label" for="maxTabs">
            Close oldest tabs when count exceeds
          </label>
          <input
            type="number"
            id="maxTabs"
            min="5"
            max="100"
            value="20"
            class="number-input"
          />
        </div>
      </div>
    </section>

    <!-- Countdown Section -->
    <section class="card">
      <h2>Countdown</h2>
      <label class="range-label" for="countdownDuration">
        Countdown before closing: <strong id="countdownValue">60</strong> seconds
      </label>
      <input
        type="range"
        id="countdownDuration"
        min="10"
        max="120"
        step="5"
        value="60"
      />
    </section>

    <!-- Whitelisted Domains Section -->
    <section class="card">
      <h2>Whitelisted Domains</h2>
      <div class="domain-input-row">
        <input
          type="text"
          id="domainInput"
          placeholder="e.g., gmail.com"
          class="text-input"
        />
        <button id="addDomainBtn" class="btn btn-primary">Add</button>
      </div>
      <ul id="domainList" class="domain-list"></ul>
    </section>

    <!-- Closed Tabs History Section -->
    <section class="card">
      <h2>Closed Tabs History</h2>
      <ul id="historyList" class="history-list">
        <li class="empty-state">No closed tabs yet.</li>
      </ul>
      <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
    </section>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast">Saved</div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
